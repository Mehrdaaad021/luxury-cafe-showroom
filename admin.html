<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>پنل مدیریت کافه</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font@v5.0.1/dist/font-face.css"/>
<style>
  *{box-sizing:border-box;margin:0}
  :root{--bg:#171310;--panel:#1e1915;--panel2:#282219;--line:#3a322a;--txt:#f2ece2;--mut:#a89b8a;--acc:#c07a4a;--acc2:#e0b489;--bad:#f87171;--ok:#86efac}
  body{font-family:"Shabnam",Tahoma,sans-serif;background:var(--bg);color:var(--txt)}
  button{font-family:inherit;cursor:pointer;border:0;border-radius:10px}
  input,textarea,select{font-family:inherit;width:100%;min-width:0;background:#faf6ef;color:#241f1a;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
  textarea{min-height:70px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--acc)}
  input[type="checkbox"]{width:18px;height:18px;accent-color:var(--acc);cursor:pointer}
  input[type="color"]{padding:4px;height:42px;background:var(--panel2)}
  input[type="range"]{padding:0;height:26px;background:transparent;border:0;accent-color:var(--acc)}
  .num{direction:ltr;text-align:left}
  .btn{padding:9px 16px;font-size:13.5px;font-weight:600}
  .btn.primary{background:var(--acc);color:#fff}
  .btn.primary:hover{background:#d18a58}
  .btn.save{padding:11px 28px;font-size:15px;box-shadow:0 4px 16px rgba(192,122,74,.4)}
  .btn.ghost{background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--txt)}
  .btn.big{width:100%;padding:13px;font-size:15px}
  .btn.ok{background:#2c5a3d;color:var(--ok);border:1px solid #3f7a54}
  .btn.ok:hover{background:#356b49}
  .mini{background:transparent;color:var(--mut);font-size:14px;padding:1px 6px;border-radius:7px}
  .mini:hover{color:var(--acc2)}
  .del{background:transparent;color:var(--bad);font-size:14px;padding:4px 8px;border-radius:8px}
  .del:hover{background:#3a1c1c}
  .imgBtnMini{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px;opacity:.7;transition:all .2s ease}
  .imgBtnMini:hover{opacity:1}
  .imgBtnMini.has{opacity:1;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
  .addBtn{background:var(--panel2);color:var(--acc2);border:1px dashed var(--line);padding:9px;border-radius:10px;width:100%;font-size:13.5px}
  .addBtn:hover{border-color:var(--acc);color:var(--txt)}
  .switchLab{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--acc2);white-space:nowrap}
  .tagRow{display:flex;gap:6px;flex-wrap:wrap}
  .tagChip{background:var(--panel2);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:11px;transition:all .15s ease}
  .tagChip:hover{color:var(--txt)}
  .tagChip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .warn{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.4);color:#fca5a5;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.9}
  .qrBox{background:#fff;padding:14px;border-radius:12px;display:inline-block;margin-top:12px}
  .qrBox canvas,.qrBox img{display:block}
  .volRow{display:flex;align-items:center;gap:12px;margin-top:8px}
  .volRow .lab{margin-bottom:0;min-width:90px}
  .volRow input{flex:1}
  .volRow span{min-width:44px;text-align:center;color:var(--acc2);font-size:13px}
  #app{display:none}
  body.logged #app{display:block}
  body.logged #login{display:none}
  .loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 70% -10%,#3a2a1c 0%,var(--bg) 60%)}
  .loginCard{width:350px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .logo{font-size:40px}
  .loginCard h1{font-size:19px;margin:10px 0 4px}
  .loginCard .sub{color:var(--mut);font-size:13px;margin-bottom:20px}
  #err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
  .topbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:11px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
  .brand{font-size:16px;font-weight:700}
  .grow{flex:1}
  .badge{background:#4a2c1c;color:var(--acc2);font-size:12px;padding:5px 10px;border-radius:20px}
  .shell{display:flex;align-items:stretch}
  .side{position:sticky;top:58px;height:calc(100vh - 58px);width:236px;min-width:236px;overflow-y:auto;
    background:var(--panel);border-inline-start:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:10px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:9px;background:transparent;color:var(--mut);padding:9px 12px;
    border-radius:10px;font-size:13.5px;text-align:right;transition:all .2s ease;border:1px solid transparent}
  .side nav button:hover{background:var(--panel2);color:var(--txt)}
  .side nav button.on{background:var(--panel2);color:var(--acc2);border-color:var(--line)}
  .sideFoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
  main{flex:1;min-width:0;max-width:960px;margin:0 auto;padding:22px 26px 90px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:18px;overflow:hidden}
  .card header{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .card header h3{font-size:15px;font-weight:700}
  .rows{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  .g2,.g3{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .fld.full{grid-column:1/-1}
  .lab{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--acc2);margin-bottom:5px}
  .thead{display:grid;gap:8px;font-size:11.5px;color:var(--mut);margin-top:4px}
  .thead>*,.trow>*{min-width:0}
  .trow{display:grid;gap:8px;align-items:center}
  .ev{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .ev .tag{font-size:12px;color:var(--mut)}
  .evItem{display:flex;flex-direction:column;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:10px}
  .evItem:last-of-type{border-bottom:0}
  .imgRow{display:flex;gap:14px;align-items:flex-start}
  .thumbBox{width:92px;height:92px;min-width:92px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);
    display:grid;place-items:center;overflow:hidden;position:relative}
  .thumbBox img{width:100%;height:100%;object-fit:cover;display:block}
  .thumbBox[data-empty="1"]::after{content:"بدون تصویر";position:absolute;font-size:10px;color:var(--mut)}
  .imgCtl{flex:1;min-width:0}
  .imgBtns{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .imgBtns label.btn,.imgBtns button{display:inline-block;font-size:12.5px;padding:7px 13px}
  .colorsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px 18px}
  .preview{position:fixed;top:58px;left:0;bottom:0;width:min(560px,55%);z-index:7;border-inline-end:1px solid var(--line);background:#000;box-shadow:20px 0 50px rgba(0,0,0,.5)}
  .preview iframe{width:100%;height:100%;border:0}
  #toast{position:fixed;bottom:24px;inset-inline-start:24px;background:var(--panel2);border:1px solid var(--line);padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transform:translateY(12px);transition:.25s;z-index:9}
  #toast.show{opacity:1;transform:none}
  .hide{display:none!important}
  .hint{font-size:12px;color:var(--mut);line-height:1.9}
  @media(max-width:900px){
    .shell{flex-direction:column}
    .side{position:static;height:auto;width:100%;min-width:0;flex-direction:row;flex-wrap:wrap;border:0;border-bottom:1px solid var(--line)}
    .side nav{flex-direction:row;flex-wrap:wrap}
    .sideFoot{margin-top:0;border:0;flex-direction:row}
    .preview{width:100%;top:auto;height:60%}
  }
</style>
</head>
<body>

<div id="login" class="loginWrap">
  <div class="loginCard">
    <div class="logo">☕</div>
    <h1>پنل مدیریت کافه</h1>
    <p class="sub">برای ورود رمز عبور را وارد کنید</p>
    <input id="pass" type="password" placeholder="رمز عبور"/>
    <div style="height:12px"></div>
    <button id="loginBtn" class="btn primary big">ورود به پنل</button>
    <p id="err"></p>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">☕ پنل مدیریت کافه</div>
    <div class="grow"></div>
    <span id="dirty" class="badge" hidden>● ذخیره‌نشده</span>
    <button id="previewBtn" class="btn ghost">👁 پیش‌نمایش</button>
    <button id="saveBtn" class="btn primary save">💾 ذخیره تغییرات</button>
    <button id="outBtn" class="btn ghost">خروج</button>
  </header>
  <div class="shell">
    <aside class="side">
      <input id="search" placeholder="🔍 جست‌وجو…"/>
      <nav id="nav"></nav>
      <div class="sideFoot">
        <button id="resetBtn" class="btn ghost">♻ برگشت به قالب</button>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <section id="previewPane" class="preview" hidden><iframe id="pv" src="index.html"></iframe></section>
</div>
<div id="toast"></div>

<script src="manifest.js"></script>
<script src="content.js"></script>

var DIG = "0-9\\u06F0-\\u06F9\\u0660-\\u0669";
var RUN_RE = new RegExp("[" + DIG + "][" + DIG + ",،٬]*", "g");
function groupDigits(str){
  return String(str).replace(RUN_RE, function(run){
    var clean = run.replace(/[,،٬]/g, "");
    if (clean.length < 4) return run;
    var out = "", count = 0;
    for (var i = clean.length - 1; i >= 0; i--) {
      out = clean.charAt(i) + out; count++;
      if (count % 3 === 0 && i > 0) out = "," + out;
    }
    return out;
  });
}
function wirePrice(inp){
  inp.classList.add("price");
  inp.value = groupDigits(inp.value);
  inp.addEventListener("input", function(){
    var v = groupDigits(inp.value);
    if (v !== inp.value) inp.value = v;
  });
}

    { o: 7, c: 22 }, { o: 7, c: 22 }, { o: 7, c: 22 }, { o: 7, c: 22 },

  ],
  specials: [
    "ویژه امروز: قهوه دارچین و هل", "ویژه امروز: کلد برو پرتقال", "ویژه امروز: موکای فندق",
    "ویژه امروز: لاته زعفرونی", "ویژه امروز: کلد برو نارگیل", "ویژه امروز: شات خرما و گردو",
    "ویژه امروز: لاته عسل و گلاب"
  ],

  customSections: [],

};
var FA_WEEK = ["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];
var WEEK_ORDER = [6,0,1,2,3,4,5];

var edits = JSON.parse(JSON.stringify(window.CONTENT || {}));
var draftLoaded = false;
try {
  var lc = localStorage.getItem(K_C);
  if (lc){ var pc = JSON.parse(lc); if (pc && typeof pc === "object") edits = pc; }
} catch(e){}
["site","text","images","colors"].forEach(function(k){ edits[k] = edits[k] || {}; });
try {
  var ld = localStorage.getItem(K_D);
  if (ld){
    var pd = JSON.parse(ld);
    if (pd && pd.edits){
      edits = pd.edits;
      ["site","text","images","colors"].forEach(function(k){ edits[k] = edits[k] || {}; });
      draftLoaded = true;
    }
  }
} catch(e){}
if (!edits.story) edits.story = deep(M.story || {title:"",intro:"",timeline:[]});
if (!edits.reviews) edits.reviews = deep(M.reviews || {title:"",items:[]});
if (!edits.settings) edits.settings = deep(DEF_SETTINGS);
edits.settings.sectionsOff = edits.settings.sectionsOff || {};
edits.settings.customSections = edits.settings.customSections || [];
edits.settings.brand = edits.settings.brand || {};
edits.settings.team = (edits.settings.team && edits.settings.team.length) ? edits.settings.team : deep(DEF_TEAM);
if (edits.settings.musicVol == null) edits.settings.musicVol = 0.8;
var MD = deep(edits.menu || M.menu || []);
var dirty = false, dirHandle = null, pvTimer = null;

var SECTIONS = [
  ["site","🌐","سایت"], ["settings","⚙️","تنظیمات و تماس"], ["brand","🎨","برند من"],
  ["qr","📱","QR منو"], ["sections","🧩","بخش‌های سایت"],
  ["images","🖼","تصویرها و بارگذاری"], ["top","⭐","معرفی"], ["left","🏠","سربرگ"],
  ["menu","☕","منو"], ["story","📖","قصه"], ["reviews","💬","نظرها"], ["team","👥","تیم ما"],
  ["beans","🫘","دانه‌ها"], ["subscriptions","📦","اشتراک"], ["wholesale","🏪","عمده"],

];
var ML = /tagline|secNote|intro|eventWhen|eventDetail|planWhat|planPrice|beanOrigin|beanNotes|body|fine|quote/;
function isML(k,v){ return ML.test(k) || String(v).indexOf("\n") > -1; }
function el(t,c,x){
  var n=document.createElement(t);
  if(c)n.className=c;
  if(x!=null){
    if (typeof x === "object") n.appendChild(x);
    else n.textContent = x;
  }
  return n;
}
function labelFor(k){
  var p=k.split("."), n2=Number(p[2])+1, n3=Number(p[3])+1;
  var sp={"top.intro":"متن معرفی","left.name":"نام سایت","left.tagline":"شعار سایت","left.text":"وضعیت باز/بسته",
    "menu.fine":"پانوشت منو","menu.title":"عنوان بخش منو","visit.body":"آدرس و مکان","visit.label":"عنوان جعبه ساعت","visit.label2":"عنوان جعبه آدرس",
    "wholesale.text":"جمله تماس","wholesale.link":"ایمیل عمده","visit.link":"تلفن","visit.link2":"ایمیل کافه",
    "footer.footName":"نام پاورقی","footer.body":"متن پاورقی","footer.link":"لینک پاورقی","subscriptions.button":"متن دکمه اشتراک",
    "story.title":"عنوان بخش قصه","story.intro":"متن معرفی قصه","reviews.title":"عنوان بخش نظرها"};
  if (sp[p[0]+"."+p[1]]) return sp[p[0]+"."+p[1]];
  var g={"link":"لینک سربرگ "+n2,"link2":"لینک موبایل "+n2,"term":"عنوان "+n2,"body":"متن "+n2,"term2":"عنوان "+n2,"body2":"متن "+n2,
    "secNo":"شماره بخش","title":"عنوان بخش","secNote":"توضیح بخش","title2":"زیرعنوان "+n2,"sizes":"اندازه‌ها "+n2,
    "itemName":"نام آیتم "+n2+" ردیف "+n3,"itemNote":"یادداشت "+n2+"-"+n3,"itemPrice":"قیمت "+n2+"-"+n3,
    "beanOrigin":"خاستگاه "+n2,"beanNotes":"طعم "+n2,"roastLabel":"بوداده "+n2,"beanPrice":"قیمت "+n2,
    "planWhat":"توضیح پلن "+n2,"planPrice":"قیمت پلن "+n2,"item":"قاعده "+n2,
    "dateDay":"روز "+n2,"dateMonth":"ماه "+n2,"eventWhen":"زمان "+n2,"eventDetail":"توضیح "+n2};
  return g[p[1]] || k;
}
function cur(kind,k){
  if (edits[kind].hasOwnProperty(k)) return edits[kind][k];
  if (M[kind] && M[kind][k] != null) return M[kind][k];
  return "";
}
function effective(){
  var out={site:{},text:{},images:{},colors:{},menu:deep(MD),story:deep(edits.story),reviews:deep(edits.reviews),settings:deep(edits.settings)};
  ["site","text","images","colors"].forEach(function(kind){
    Object.keys(M[kind]).forEach(function(k){ out[kind][k]=cur(kind,k); });
    Object.keys(edits[kind]).forEach(function(k){ out[kind][k]=edits[kind][k]; });
  });

/* نوشتن فایل موزیک داخل پوشه پروژه: media/music.mp3 */
async function placeMusic(file){
  try{
    if(!dirHandle) dirHandle = await window.showDirectoryPicker({mode:"readwrite"});
    var mediaDir = await dirHandle.getDirectoryHandle("media", {create:true});
    var fh = await mediaDir.getFileHandle("music.mp3", {create:true});
    var w = await fh.createWritable();
    await w.write(file);
    await w.close();
    return true;
  }catch(e){ return false; }
}

function qrCard(){

  var dl=el("button","btn ghost","⬇ دانلود PNG");
  btnRow.appendChild(gen); btnRow.appendChild(dl);
  b.appendChild(btnRow); b.appendChild(box);
  function loadLib(cb){
    if (window.QRCode) { cb(); return; }
    var s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    s.onload=function(){ cb(); };
    s.onerror=function(){ toast("اتصال اینترنت برای کتابخانه QR لازم است."); };
    document.body.appendChild(s);
  }
  function overlayLogo(){
    var cv=box.querySelector("canvas");
    var logoSrc=edits.images["img.logo"];
    if(!cv||!logoSrc) return;
    var im=new Image();
    im.onload=function(){
      var ctx=cv.getContext("2d");
      var s=cv.width*0.24;
      var x=(cv.width-s)/2;
      ctx.fillStyle="#ffffff";
      ctx.fillRect(x-6,x-6,s+12,s+12);
      ctx.drawImage(im,x,x,s,s);
    };
    im.src=logoSrc;
  }
  gen.onclick=function(){
    var url=urlInp.value.trim();
    if(!url){ toast("اول آدرس را بنویس."); return; }
    loadLib(function(){
      box.style.display="inline-block";
      box.innerHTML="";
      new QRCode(box,{text:url,width:260,height:260,colorDark:"#241f1a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});

    a.href=cv.toDataURL("image/png");
    a.download="menu-qr.png";
    a.click();
  };
  c.appendChild(b); return c;
}

      ni.oninput=function(){ it.name=ni.value; syncMenu(); };
      var oi=el("input"); oi.type="text"; oi.value=it.note||""; oi.placeholder="یادداشت";
      oi.oninput=function(){ it.note=oi.value; syncMenu(); };
      var pi=el("input","num"); pi.type="text"; pi.value=it.price||""; pi.placeholder="۸۵,۰۰۰";
      pi.oninput=function(){ it.price=pi.value; syncMenu(); };

      var imgKey = "img.menu." + ci + "." + ii;
      var ib=el("button","imgBtnMini"+(edits.images[imgKey]?" has":"")); ib.type="button"; ib.textContent="📷";
      ib.title="تصویر این آیتم (پیش‌نمایش هاور در سایت)";
      ib.onclick=function(){
        if (edits.images[imgKey]) {
          if (confirm("تصویر این آیتم حذف شود؟")) { edits.images[imgKey]=""; ib.classList.remove("has"); touch(); }
          return;
        }
        var fi=document.createElement("input"); fi.type="file"; fi.accept="image/*";
        fi.onchange=function(){
          if(!fi.files[0])return;
          var r=new FileReader();
          r.onload=function(){ edits.images[imgKey]=r.result; ib.classList.add("has"); touch(); toast("📷 تصویر آیتم ثبت شد؛ ذخیره کن."); };
          r.readAsDataURL(fi.files[0]);
        };
        fi.click();
      };
      var xd=el("button","del","✖"); xd.title="حذف این آیتم";
      xd.onclick=function(){ cat.items.splice(ii,1); syncMenu(); replaceMenuCard(); };
      r.appendChild(ni); r.appendChild(oi); r.appendChild(pi); r.appendChild(ib); r.appendChild(xd);
      wrap.appendChild(r);
      var tagRow=el("div","tagRow");

        var onNow=(it.tags||[]).indexOf(tg)>-1;
        var tb=el("button","tagChip"+(onNow?" on":"")); tb.type="button"; tb.textContent=tg;
        tb.onclick=function(){
          it.tags=it.tags||[];
          var ix=it.tags.indexOf(tg);
          if(ix>-1) it.tags.splice(ix,1); else it.tags.push(tg);
          tb.classList.toggle("on");
          syncMenu();
        };
        tagRow.appendChild(tb);
      });
      wrap.appendChild(tagRow);
      box.appendChild(wrap);
    });
    var add=el("button","addBtn","+ افزودن آیتم به این دسته");
    add.onclick=function(){ cat.items=cat.items||[]; cat.items.push({name:"آیتم جدید",note:"",price:"۰ تومان",tags:[]}); syncMenu(); replaceMenuCard(); };
    box.appendChild(add);
    b.appendChild(box);
  });
  var addCat=el("button","addBtn","+ افزودن دسته جدید");
  addCat.onclick=function(){ MD.push({title:"دسته جدید",sizes:"",items:[{name:"آیتم نمونه",note:"",price:"۰ تومان",tags:[]}]}); syncMenu(); replaceMenuCard(); };

}

function preview(){
  var p=document.getElementById("previewPane"); if(!p||p.hidden)return;
  clearTimeout(pvTimer);
  pvTimer=setTimeout(function(){
    try{ document.getElementById("pv").contentWindow.postMessage({type:"cms-preview",content:effective()},"*"); }catch(e){}
  },250);
}

async function save(){
  var data = effective();
  var json = JSON.stringify(data, null, 2);
  try{ localStorage.setItem(K_C, json); localStorage.removeItem(K_D); }catch(e){}
  var text = "window.CONTENT = " + json + ";\n";
  try{
    if(!dirHandle) dirHandle=await window.showDirectoryPicker({mode:"readwrite"});
    var fh=await dirHandle.getFileHandle("content.js",{create:true});
    var w=await fh.createWritable(); await w.write(text); await w.close();
    dirty=false; document.getElementById("dirty").hidden=true;
    toast("✅ ذخیره شد! سایت را رفرش کن.");
  }catch(e){
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type:"text/javascript"}));
    a.download="content.js"; a.click();
    dirty=false; document.getElementById("dirty").hidden=true;
    toast("⬇ فایل content.js دانلود شد؛ آن را داخل پوشه سایت جایگزین کن.");
  }
}
document.getElementById("saveBtn").onclick=save;
document.addEventListener("keydown",function(e){ if((e.ctrlKey||e.metaKey)&&e.key==="s"){ e.preventDefault(); save(); } });
document.getElementById("resetBtn").onclick=function(){
  if(!confirm("همه تغییرات به قالب اصلی برگردد؟"))return;
  edits={site:{},text:{},images:{},colors:{}};
  MD=deep(M.menu||[]);
  edits.story=deep(M.story); edits.reviews=deep(M.reviews); edits.settings=deep(DEF_SETTINGS);
  try{ localStorage.removeItem(K_D); }catch(e){}
  renderAll(); touch(); toast("♻ به قالب برگشت؛ برای قطعی شدن ذخیره کن.");
};
